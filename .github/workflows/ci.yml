name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (ktlint + spotless + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Station's wifi-helper compiles with source/target 1.7, which needs a JDK
      # that still supports it (<= 17); the rest of the project targets JVM 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: spotless (Java)
        run: ./gradlew spotlessCheck

      - name: Unit tests
        run: ./gradlew test

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: pip install ruff==0.14.0 pytest

      - name: Ruff lint
        run: ruff check --config ../pyproject.toml .

      - name: Ruff format check
        run: ruff format --check --config ../pyproject.toml .

      - name: Pytest
        run: python -m pytest tests -q
