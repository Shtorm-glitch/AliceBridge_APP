<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'none'; frame-src 'none'; base-uri 'none'"><link rel="stylesheet" href="xterm.css"><style>html,body,#terminal{margin:0;width:100%;height:100%;overflow:hidden;background:#090d17}.xterm{padding:5px;box-sizing:border-box}</style></head><body><div id="terminal"></div><script src="xterm.js"></script><script src="addon-fit.js"></script><script>
'use strict';
const term=new Terminal({cursorBlink:true,fontSize:13,fontFamily:'monospace',scrollback:2500,convertEol:false,theme:{background:'#090d17',foreground:'#edf0fc',cursor:'#b6a1ff',selectionBackground:'#494060'}});
const fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open(document.getElementById('terminal'));
term.onData(data=>AndroidTerminal.send(data));
term.onResize(size=>AndroidTerminal.resize(size.cols,size.rows));
window.appendOutput=encoded=>{const raw=atob(encoded);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);term.write(bytes);};
window.terminalKey=data=>{term.input(data,true);term.focus();};
window.pasteText=text=>{term.paste(text);term.focus();};
window.clearTerminal=()=>term.clear();window.focusTerminal=()=>term.focus();
let ready=false;function resize(){try{fit.fit();if(!ready&&term.cols>=10&&term.rows>=3){ready=true;AndroidTerminal.ready(term.cols,term.rows);}}catch(e){}}
new ResizeObserver(resize).observe(document.getElementById('terminal'));window.addEventListener('resize',resize);setTimeout(resize,100);
</script></body></html>
